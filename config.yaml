# Конфигурация IP Manager.
# Все параметры, кроме scan.networks, необязательны — ниже указаны значения по умолчанию.

scan:
  # Сети в формате CIDR (только IPv4, не крупнее /16).
  networks:
    - 192.168.1.0/24
    # - 10.0.0.0/24

  # Как часто запускать сканирование (минимум 10s). Примеры: 30s, 5m, 1h.
  interval: 5m

  # Сколько ждать ответа от одного хоста на каждую проверку.
  timeout: 1s

  # Сколько адресов проверять одновременно.
  concurrency: 128

  # Способы определения живого хоста:
  #   ping — системная команда ping (root не нужен)
  #   tcp  — попытка подключения к портам из tcp_ports; ответ "connection refused"
  #          тоже означает, что хост жив
  methods: [ping, tcp]

  # Порты для метода tcp. Открытые порты сохраняются в базе.
  tcp_ports: [22, 80, 443, 445, 3389]

  # Определять имя хоста через обратный DNS (PTR).
  resolve_names: true

  # Удалять из базы хосты, которых нет в сети дольше этого срока.
  # 0 — хранить всегда. Пример: 720h (30 дней).
  forget_after: 0s

database:
  # Файл SQLite (создаётся автоматически).
  path: ./ipmanager.db

web:
  # Адрес веб-интерфейса. Чтобы открыть доступ из сети: ":8080".
  # Аутентификации в приложении нет.
  listen: 127.0.0.1:8080
